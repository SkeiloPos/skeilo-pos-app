<!doctype html>
<html lang="es" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <!-- spec 134 (FR-001/FR-002): la app solo existe en español. El idioma, el atributo
       translate y este meta viajan juntos: declarar solo el idioma haría que teléfonos
       en inglés ofrezcan traducir; solo el bloqueo dejaría el idioma mal declarado.
       Se declara en el elemento raíz (no en app-root) para heredarse a las capas
       que Angular/CDK montan fuera de app-root. -->
  <meta name="google" content="notranslate">
  <title>SkeiloPOS</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // spec 116 (research.md R4, FR-012/FR-013/FR-014): fija el tema del panel
    // ANTES del primer pintado -- Angular es 100% CSR aquí, así que si esto
    // viviera dentro de un componente habría un frame real en el tema por
    // defecto antes de corregirse (SC-002 lo prohíbe). Nunca lanza: sin esto
    // ni señal del sistema, el tema por defecto (claro, sin atributo) ya es
    // correcto.
    (function () {
      try {
        var saved = localStorage.getItem('pos.panel.theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.dataset.theme = saved;
          return;
        }
      } catch (e) {
        // localStorage bloqueado (navegación privada u otro): sin preferencia
        // guardada que leer, se sigue con la señal del sistema.
      }
      try {
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) {
        // sin matchMedia (entorno de prueba u otro): el tema por defecto
        // (claro, sin atributo) ya es correcto.
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
